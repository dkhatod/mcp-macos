[package]
name = "mcp-macos"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "MCP server exposing Apple Mail, Messages, Calendar, Notifications, and Clipboard to any MCP client"
repository = "https://github.com/dkat/mcp-macos"
keywords = ["macos", "applescript", "mcp", "apple-mail", "calendar"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
personai-core = { path = "../personai-core", version = "0.2" }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"