name: ci
on: [push, pull_request]

jobs:
  linux:
    # Unit + contract tests run entirely on the mock transport — no macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
  macos:
    # Exercises the real `osascript` path. Integration tests are strictly
    # read-only (list/search/read); gated sends are mock-tested only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo test
